name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      # Signature SignPath : active seulement quand le secret existe (voir docs/signing.md).
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # Exe portable + installateur NSIS (Program Files, désinstallable depuis Windows).
      # L'installateur embarque l'exe avant signature : à revoir quand SignPath sera actif.
      - run: npm run tauri build -- --bundles nsis
      - shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/kleaner.exe kleaner.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName kleaner-setup.exe

      - name: Upload unsigned exe for signing
        if: env.SIGNING == 'true'
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: kleaner-unsigned
          path: kleaner.exe
      - name: Sign with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kleaner
          signing-policy-slug: release-signing
          artifact-configuration-slug: portable-exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Use signed exe
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item signed/kleaner.exe kleaner.exe -Force
          $sig = Get-AuthenticodeSignature kleaner.exe
          if ($sig.Status -ne 'Valid') { throw "Signature invalide : $($sig.Status)" }

      - name: SHA-256
        shell: pwsh
        run: |
          foreach ($f in 'kleaner.exe', 'kleaner-setup.exe') {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  $f" | Out-File -Encoding ascii "$f.sha256"
          }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kleaner.exe
            kleaner.exe.sha256
            kleaner-setup.exe
            kleaner-setup.exe.sha256
          generate_release_notes: true
          # v0.1.0-rc1 → pre-release ; v0.1.0 → release normale.
          prerelease: ${{ contains(github.ref_name, '-') }}
