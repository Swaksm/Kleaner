name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-latest
    env:
      # Signature SignPath : active seulement quand le secret existe (voir docs/signing.md).
      SIGNING: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      # 1. L'exe seul, sans installateur : il est signé AVANT d'être mis dans l'installateur,
      #    sinon l'installateur installerait un exe non signé.
      - run: npm run tauri build -- --no-bundle
        env:
          # Version affichée et comparée aux releases (sinon celle de tauri.conf.json pour toutes les rc).
          VITE_APP_VERSION: ${{ github.ref_name }}

      - name: Upload unsigned exe for signing
        if: env.SIGNING == 'true'
        id: unsigned-exe
        uses: actions/upload-artifact@v4
        with:
          name: kleaner-exe-unsigned
          path: src-tauri/target/release/kleaner.exe
      - name: Sign exe with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kleaner
          signing-policy-slug: release-signing
          artifact-configuration-slug: portable-exe
          github-artifact-id: ${{ steps.unsigned-exe.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-exe
      - name: Put signed exe back for the installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          $sig = Get-AuthenticodeSignature signed-exe/kleaner.exe
          if ($sig.Status -ne 'Valid') { throw "Signature de l'exe invalide : $($sig.Status)" }
          Copy-Item signed-exe/kleaner.exe src-tauri/target/release/kleaner.exe -Force

      # 2. Installateur NSIS (Program Files, désinstallable depuis Windows) autour de l'exe déjà signé.
      #    « tauri bundle » ne recompile pas : il emballe l'exe présent dans target/release.
      - run: npm run tauri bundle -- --bundles nsis
      - shell: pwsh
        run: |
          Copy-Item src-tauri/target/release/kleaner.exe kleaner.exe
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1).FullName kleaner-setup.exe

      # 3. L'installateur lui-même est signé à son tour.
      - name: Upload unsigned installer for signing
        if: env.SIGNING == 'true'
        id: unsigned-setup
        uses: actions/upload-artifact@v4
        with:
          name: kleaner-setup-unsigned
          path: kleaner-setup.exe
      - name: Sign installer with SignPath
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: kleaner
          signing-policy-slug: release-signing
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed-setup
      - name: Use signed installer
        if: env.SIGNING == 'true'
        shell: pwsh
        run: |
          Copy-Item signed-setup/kleaner-setup.exe kleaner-setup.exe -Force
          foreach ($f in 'kleaner.exe', 'kleaner-setup.exe') {
            $sig = Get-AuthenticodeSignature $f
            if ($sig.Status -ne 'Valid') { throw "Signature invalide pour $f : $($sig.Status)" }
          }

      - name: SHA-256
        shell: pwsh
        run: |
          foreach ($f in 'kleaner.exe', 'kleaner-setup.exe') {
            (Get-FileHash $f -Algorithm SHA256).Hash.ToLower() + "  $f" | Out-File -Encoding ascii "$f.sha256"
          }
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            kleaner.exe
            kleaner.exe.sha256
            kleaner-setup.exe
            kleaner-setup.exe.sha256
          generate_release_notes: true
          # v1.1.0-rc1 → pre-release ; v1.0.0 → release normale.
          prerelease: ${{ contains(github.ref_name, '-') }}
